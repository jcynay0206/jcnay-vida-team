<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Todo listo! | JCNay Vida Team</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --oro: #d4af37; --negro: #050505; --gradient-oro: linear-gradient(45deg, #b8860b, #d4af37, #f2d472); }
        body { font-family: 'Poppins', sans-serif; background-color: var(--negro); color: white; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; margin: 0; }
        .card { background: rgba(255, 255, 255, 0.05); padding: 50px 30px; border-radius: 15px; border: 1px solid var(--oro); max-width: 600px; margin: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        h1 { font-family: 'Cinzel', serif; color: var(--oro); font-size: 2.2rem; margin-bottom: 20px; }
        p { line-height: 1.6; color: #ddd; font-size: 1.1rem; }
        .check-icon { font-size: 4.5rem; color: #25D366; margin-bottom: 25px; }
        .btn-calc { background: var(--gradient-oro); color: black !important; padding: 18px 35px; text-decoration: none; display: inline-block; font-weight: 800; border-radius: 5px; margin-top: 30px; text-transform: uppercase; transition: 0.3s; box-shadow: 0 4px 15px rgba(212,175,55,0.3); }
        .btn-calc:hover { transform: scale(1.05); filter: brightness(1.1); }
        .footer-note { margin-top: 25px; font-size: 0.85rem; color: #777; }
    </style>
</head>
<body>

    <div class="card">
        <div class="check-icon"><i class="fas fa-file-invoice-dollar"></i></div>
        <h1>¡Descarga Iniciada!</h1>
        
        <p>Tu guía <strong>"Banco Libre"</strong> se está descargando ahora mismo. Por favor, revisa tu carpeta de descargas.</p>
        
        <p style="margin-top: 20px; font-weight: 600;">¿Quieres poner estos conceptos a prueba con tus propios números?</p>
        
        <a href="https://jcynay0206.github.io/calculadora-iul/" class="btn-calc">
            <i class="fas fa-calculator"></i> Probar Calculadora de Retiro IUL
        </a>

        <div class="footer-note">
            Si la descarga no comenzó automáticamente, <a href="Banco_Libre.pdf" download style="color: var(--oro); text-decoration: none;">haz clic aquí para reintentar</a>.
        </div>
    </div>

</body>
</html>
