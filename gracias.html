<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias! | JCNay Vida Team</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #05070a;
            color: white;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            padding: 50px;
            border-radius: 40px;
            border: 1px solid #d4af37;
            max-width: 500px;
            backdrop-filter: blur(10px);
        }
        h1 { font-family: 'Cinzel', serif; color: #d4af37; margin-bottom: 20px; }
        p { font-size: 1.1rem; margin-bottom: 30px; line-height: 1.6; }
        .btn-gold {
            background: linear-gradient(135deg, #b8860b 0%, #d4af37 50%, #f9e2af 100%);
            color: #05070a;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 800;
            text-transform: uppercase;
            display: inline-block;
            transition: 0.4s;
        }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(212,175,55,0.4); }
    </style>
</head>
<body>
    <div class="card">
        <h1>¡Tu guía ya va en camino!</h1>
        <p>Hemos recibido tu solicitud correctamente. Revisa tu correo en unos minutos.<br><br>
        Mientras llega, <strong>¿te gustaría probar nuestra calculadora de IUL?</strong></p>
        <a href="https://jcynay0206.github.io/calculadora-iul/" class="btn-gold">Probar Calculadora</a>
        <br><br>
        <a href="index.html" style="color: #888; text-decoration: none; font-size: 0.8rem;">Volver al inicio</a>
    </div>
</body>
</html>
