<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Jubilación | 401k vs IUL</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0a1a2a;
      --gold: #c9a86a;
      --ivory: #faf7f2;
      --muted: #6b6b6b;
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Inter", sans-serif;
      background: var(--ivory);
      color: var(--navy);
      padding-bottom: 60px;
    }

    .wrapper {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: 2.6rem;
      text-align: center;
      margin-bottom: 10px;
    }

    .muted {
      text-align: center;
      color: var(--muted);
      margin-bottom: 40px;
    }

    .card {
      background: #fff;
      padding: 26px;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      margin-bottom: 30px;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
      font-size: 1rem;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      background: var(--gold);
      color: var(--navy);
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: 0.25s;
      font-size: 1rem;
    }

    .btn:hover { background: #b89555; }

    .result {
      background: #fff;
      padding: 26px;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      margin-top: 30px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.6;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 40px;
      color: var(--navy);
      font-weight: 600;
      text-decoration: none;
    }

    .back:hover { color: var(--gold); }
  </style>
</head>

<body>

  <div class="wrapper">

    <h1>Calculadora de Jubilación</h1>
    <p class="muted">Compara el crecimiento de un 401k tradicional vs un IUL con piso 0%.</p>

    <div class="card">
      <label>Saldo actual</label>
      <input type="number" id="saldo" placeholder="Ej: 20000">

      <label>Aporte anual</label>
      <input type="number" id="aporte" placeholder="Ej: 6000">

      <label>Años hasta la jubilación</label>
      <input type="number" id="anios" placeholder="Ej: 25">

      <button class="btn" onclick="calcular()">Calcular</button>
    </div>

    <div id="resultado" class="result" style="display:none;"></div>

    <a href="../../index.html" class="back">← Volver al inicio</a>

  </div>

  <script>
    function calcular() {
      const saldoInicial = Number(document.getElementById("saldo").value);
      const aporte = Number(document.getElementById("aporte").value);
      const anios = Number(document.getElementById("anios").value);

      if (!saldoInicial && !aporte && !anios) {
        alert("Por favor completa al menos un campo.");
        return;
      }

      let saldo401k = saldoInicial;
      let saldoIUL = saldoInicial;

      for (let i = 0; i < anios; i++) {
        // 401k crece 8% anual
        saldo401k = saldo401k * 1.08 + aporte;

        // IUL crece 8% pero con piso 0%
        let crecimiento = saldoIUL * 1.08;
        saldoIUL = Math.max(crecimiento, saldoIUL) + aporte;
      }

      document.getElementById("resultado").style.display = "block";
      document.getElementById("resultado").innerHTML =
        "Resultado después de " + anios + " años:<br><br>" +
        "<strong>401k:</strong> $" + saldo401k.toLocaleString() + "<br>" +
        "<strong>IUL (piso 0%):</strong> $" + saldoIUL.toLocaleString();
    }
  </script>

</body>
</html>
