<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acelerador de Riqueza</title>

  <style>
    :root {
      --navy: #0a1a2a;
      --gold: #c9a86a;
      --ivory: #faf7f2;
      --muted: #6b6b6b;
      --radius: 14px;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--ivory);
      color: var(--navy);
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .calculator {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 26px;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 16px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: var(--radius);
      border: 1px solid #ccc;
      margin-top: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: var(--radius);
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }

    button:hover {
      background: #b89555;
    }

    .result {
      margin-top: 20px;
      padding: 20px;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    }
  </style>
</head>

<body>

  <h1>Acelerador de Riqueza</h1>

  <div class="calculator">
    <label>Deuda actual ($)</label>
    <input type="number" id="deuda">

    <label>Tasa de interés (%)</label>
    <input type="number" id="interes">

    <label>Pago mensual ($)</label>
    <input type="number" id="pago">

    <button onclick="calcular()">Calcular</button>

    <div class="result" id="resultado"></div>
  </div>

  <script>
    function calcular() {
      const deuda = parseFloat(document.getElementById("deuda").value);
      const interes = parseFloat(document.getElementById("interes").value) / 100;
      const pago = parseFloat(document.getElementById("pago").value);

      if (!deuda || !interes || !pago) {
        document.getElementById("resultado").innerHTML = "Por favor completa todos los campos.";
        return;
      }

      let balance = deuda;
      let meses = 0;
      let interesesPagados = 0;

      while (balance > 0 && meses < 1000) {
        const interesMes = balance * (interes / 12);
        interesesPagados += interesMes;
        balance = balance + interesMes - pago;
        meses++;
      }

      const años = (meses / 12).toFixed(1);

      document.getElementById("resultado").innerHTML = `
        <p><strong>Tiempo estimado para pagar:</strong> ${años} años</p>
        <p><strong>Intereses totales pagados:</strong> $${interesesPagados.toFixed(2)}</p>
      `;
    }
  </script>

</body>
</html>
