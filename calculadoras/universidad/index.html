<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Universitaria | JCNay Vida Team</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0a1a2a;
      --gold: #c9a86a;
      --ivory: #faf7f2;
      --muted: #6b6b6b;
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Inter", sans-serif;
      background: var(--ivory);
      color: var(--navy);
      padding-bottom: 60px;
    }

    .wrapper {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: 2.6rem;
      text-align: center;
      margin-bottom: 10px;
    }

    .muted {
      text-align: center;
      color: var(--muted);
      margin-bottom: 40px;
    }

    .card {
      background: #fff;
      padding: 26px;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      margin-bottom: 30px;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
      font-size: 1rem;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      background: var(--gold);
      color: var(--navy);
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: 0.25s;
      font-size: 1rem;
    }

    .btn:hover { background: #b89555; }

    .result {
      background: #fff;
      padding: 26px;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      margin-top: 30px;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 600;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 40px;
      color: var(--navy);
      font-weight: 600;
      text-decoration: none;
    }

    .back:hover { color: var(--gold); }
  </style>
</head>

<body>

  <div class="wrapper">

    <h1>Calculadora Universitaria</h1>
    <p class="muted">Proyecta cuánto costará la universidad cuando tu hijo(a) esté listo(a) para comenzar.</p>

    <div class="card">
      <label>Costo actual anual de la universidad</label>
      <input type="number" id="costoActual" placeholder="Ej: 25000">

      <label>Años hasta que comience la universidad</label>
      <input type="number" id="anios" placeholder="Ej: 10">

      <label>Inflación educativa anual (%)</label>
      <input type="number" id="inflacion" placeholder="Ej: 5">

      <button class="btn" onclick="calcularUniversidad()">Calcular</button>
    </div>

    <div id="resultado" class="result" style="display:none;"></div>

    <a href="../../index.html" class="back">← Volver al inicio</a>

  </div>

  <script>
    function calcularUniversidad() {
      const costoActual = Number(document.getElementById("costoActual").value);
      const anios = Number(document.getElementById("anios").value);
      const inflacion = Number(document.getElementById("inflacion").value) / 100;

      if (!costoActual || !anios || !inflacion) {
        alert("Por favor completa todos los campos.");
        return;
      }

      // Fórmula: costo futuro = costoActual × (1 + inflacion)^anios
      const costoFuturo = costoActual * Math.pow(1 + inflacion, anios);

      // Costo total de 4 años
      const totalCarrera = costoFuturo * 4;

      document.getElementById("resultado").style.display = "block";
      document.getElementById("resultado").innerHTML =
        "Costo estimado por año: $" + costoFuturo.toLocaleString() +
        "<br><br>Costo total de 4 años: $" + totalCarrera.toLocaleString();
    }
  </script>

</body>
</html>
