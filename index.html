<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCNay Vida Team | Seguridad Financiera</title>
    <style>
        :root { 
            --fondo-negro: #0f172a; 
            --tarjeta-oscura: #1e293b;
            --dorado-brillante: #fbbf24;
            --dorado-mate: #d97706;
            --verde-wa: #22c55e;
            --azul-accent: #38bdf8;
            --texto-principal: #f8fafc;
            --texto-secundario: #94a3b8;
        }
        
        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            background-color: var(--fondo-negro); 
            margin: 0; padding: 15px; color: var(--texto-principal);
            line-height: 1.6;
        }

        .container { max-width: 800px; margin: 0 auto; }
        
        header { padding: 40px 20px; text-align: center; }
        h1 { margin: 0; font-size: 2.5em; letter-spacing: -1px; }

        .frase-dorada { 
            display: inline-block;
            position: relative;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.4em; 
            font-weight: 800; 
            margin-top: 10px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            overflow: hidden;
        }

        /* Destello de luz */
        .frase-dorada::after {
            content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg); animation: brillo 4s infinite;
        }
        @keyframes brillo { 0% { left: -100%; } 20% { left: 150%; } 100% { left: 150%; } }

        section { 
            background: var(--tarjeta-oscura); 
            padding: 30px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 25px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* Estilos Sobre Nosotros */
        .nosotros-flex { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; text-align: left; }
        .nosotros-img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--dorado-brillante); object-fit: cover; }
        .nosotros-txt { flex: 1; min-width: 250px; }

        .grid-externas { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 15px; margin-bottom: 25px; 
        }
        
        .card-ext { 
            background: rgba(255,255,255,0.03); padding: 20px; border-radius: 20px; 
            text-align: center; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s;
        }
        .card-ext:hover { transform: translateY(-5px); background: rgba(255,255,255,0.08); }

        input, select { 
            width: 100%; padding: 14px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px; background: rgba(0,0,0,0.2); color: white; font-size: 16px;
        }

        .btn { 
            width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 16px; 
            font-weight: 800; cursor: pointer; text-decoration: none; display: block; 
            text-align: center; transition: 0.3s; margin-top: 10px;
        }
        .btn-azul { background: var(--azul-accent); color: #0f172a; }
        .btn-verde { background: var(--verde-wa); color: white; }
        .btn-dorado { background: linear-gradient(to right, #bf953f, #aa771c); color: #0f172a; }

        #res_brecha { font-size: 42px; font-weight: 900; color: #f43f5e; margin: 15px 0; }
        small { color: var(--texto-secundario); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }

        }
