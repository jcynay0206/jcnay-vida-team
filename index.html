<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCNay Vida Team | Protección & Riqueza</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;1,700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --oro: #d4af37;
            --negro-ebano: #050505;
            --gradient-oro: linear-gradient(45deg, #b8860b, #d4af37, #f2d472);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--negro-ebano); color: white; overflow-x: hidden; }

        nav { 
            background: rgba(5, 5, 5, 0.95); padding: 15px 5%; position: fixed; width: 100%; top: 0; z-index: 1000; 
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(212, 175, 55, 0.3); backdrop-filter: blur(15px); 
        }
        .brand-container { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .favicon-img { width: 45px; height: 45px; border-radius: 4px; border: 1px solid var(--oro); }
        .brand-name { font-family: 'Cinzel', serif; color: white; font-size: 1.1rem; font-weight: 700; }

        .hero {
            height: 40vh; background: linear-gradient(rgba(5, 5, 5, 0.8), rgba(5, 5, 5, 0.8)), url('https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=1350&q=80');
            background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; margin-top: 75px;
        }

        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        section.dark-section { background: rgba(255, 255, 255, 0.03); padding: 40px; border-radius: 4px; margin-bottom: 30px; border: 1px solid rgba(212, 175, 55, 0.15); }
        h3 { font-family: 'Cinzel', serif; color: var(--oro); text-align: center; margin-bottom: 25px; letter-spacing: 2px; }
        
        input, select, textarea { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid rgba(212, 175, 55, 0.2); background: rgba(0,0,0,0.6); color: white; border-radius: 2px; font-size: 0.9rem; font-family: 'Poppins', sans-serif; }
        option { background: #111; color: white; }
        
        .boton-oro { 
            background: var(--gradient-oro); color: black !important; padding: 16px; font-weight: 800; text-transform: uppercase; 
            border: none; cursor: pointer; width: 100%; letter-spacing: 1px; transition: 0.3s; margin-top: 10px;
        }

        .check-container { display: flex; align-items: center; gap: 10px; margin: 12px 0; font-size: 0.8rem; color: #bbb; cursor: pointer; }
        footer { padding: 30px; text-align: center; color: #444; font-size: 0.7rem; }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="brand-container">
            <img src="img/logo-jcnay.jpg" alt="JN" class="favicon-img">
            <span class="brand-name">JCNay Vida Team</span>
        </a>
    </nav>

    <header class="hero">
        <p style="font-family: 'Playfair Display'; font-style: italic; font-size: 1.8rem;">Protección & Riqueza</p>
    </header>

    <div class="container">
        <section id="guia" class="dark-section" data-aos="fade-up">
            <h3>📥 Solicitar Guía Privada</h3>
            <form id="form-guia">
                <input type="text" name="nombre_tipo" placeholder="NOMBRE COMPLETO" required>
                <input type="number" name="edad_estado" placeholder="EDAD" required>
                
                <select name="ingresos_licencia" required>
                    <option value="" disabled selected>INGRESOS ANUALES ESTIMADOS</option>
                    <option value="Menos de 50K">Menos de 50K</option>
                    <option value="50K a 100K">50K a 100K</option>
                    <option value="Mas de 100K">Más de 100K</option>
                </select>

                <input type="text" name="telefonos" placeholder="TELÉFONO / CORREO" required>
                
                <input type="hidden" name="tipo_registro" value="GUIA">
                <button type="submit" class="boton-oro">Obtener Guía</button>
            </form>
        </section>

        <section id="socios" class="dark-section" data-aos="fade-up" style="border-top: 2px solid var(--oro)">
            <h3>🤝 Aplicación de Carrera</h3>
            <form id="form-socio">
                <input type="text" name="nombre_tipo" placeholder="NOMBRE COMPLETO" required>
                
                <select name="edad_estado" required>
                    <option value="" disabled selected>ESTADO DE RESIDENCIA (USA)</option>
                    <option value="AL">Alabama</option><option value="AK">Alaska</option><option value="AZ">Arizona</option>
                    <option value="AR">Arkansas</option><option value="CA">California</option><option value="CO">Colorado</option>
                    <option value="CT">Connecticut</option><option value="DE">Delaware</option><option value="FL">Florida</option>
                    <option value="GA">Georgia</option><option value="HI">Hawaii</option><option value="ID">Idaho</option>
                    <option value="IL">Illinois</option><option value="IN">Indiana</option><option value="IA">Iowa</option>
                    <option value="KS">Kansas</option><option value="KY">Kentucky</option><option value="LA">Louisiana</option>
                    <option value="ME">Maine</option><option value="MD">Maryland</option><option value="MA">Massachusetts</option>
                    <option value="MI">Michigan</option><option value="MN">Minnesota</option><option value="MS">Mississippi</option>
                    <option value="MO">Missouri</option><option value="MT">Montana</option><option value="NE">Nebraska</option>
                    <option value="NV">Nevada</option><option value="NH">New Hampshire</option><option value="NJ">New Jersey</option>
                    <option value="NM">New Mexico</option><option value="NY">New York</option><option value="NC">North Carolina</option>
                    <option value="ND">North Dakota</option><option value="OH">Ohio</option><option value="OK">Oklahoma</option>
                    <option value="OR">Oregon</option><option value="PA">Pennsylvania</option><option value="RI">Rhode Island</option>
                    <option value="SC">South Carolina</option><option value="SD">South Dakota</option><option value="TN">Tennessee</option>
                    <option value="TX">Texas</option><option value="UT">Utah</option><option value="VT">Vermont</option>
                    <option value="VA">Virginia</option><option value="WA">Washington</option><option value="WV">West Virginia</option>
                    <option value="WI">Wisconsin</option><option value="WY">Wyoming</option>
                </select>

                <input type="text" name="telefonos" placeholder="TELÉFONO / CORREO" required>
                
                <input type="hidden" name="ingresos_licencia" value="Aplicante Socio">
                <input type="hidden" name="tipo_registro" value="SOCIO">

                <label class="check-container">
                    <input type="checkbox" required style="width:auto">
                    <span>Poseo SSN y soy mayor de 18 años.</span>
                </label>

                <button type="submit" class="boton-oro">Enviar Aplicación</button>
            </form>
        </section>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbykZuGS78TLHdGUaGOPvkSVzLIa1h7BfMhcKE6FB-lhf4d3SVcubFkd-scoFGWWBg9hqg/exec';

        function conectar(formId) {
            const form = document.getElementById(formId);
            form.addEventListener('submit', e => {
                e.preventDefault();
                const btn = form.querySelector('button');
                btn.innerText = 'ENVIANDO...';
                btn.disabled = true;

                // Enviamos nombre/TIPO combinados para tu columna 2
                const nombreConTipo = form.nombre_tipo.value + " (" + form.tipo_registro.value + ")";
                
                const formData = new FormData();
                formData.append('nombre_tipo', nombreConTipo);
                formData.append('edad_estado', form.edad_estado.value);
                formData.append('ingresos_licencia', form.ingresos_licencia.value);
                formData.append('telefonos', form.telefonos.value);

                fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    body: formData,
                    mode: 'no-cors' 
                }).then(() => {
                    window.location.href = "gracias.html";
                }).catch(() => {
                    alert('Reintente en un momento');
                    btn.disabled = false;
                    btn.innerText = 'REINTENTAR';
                });
            });
        }

        conectar('form-guia');
        conectar('form-socio');
    </script>
</body>
</html>
