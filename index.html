<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCNay Vida Team | Arquitectura Financiera</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;1,700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --oro: #d4af37;
            --negro-ebano: #050505;
            --gradient-oro: linear-gradient(45deg, #b8860b, #d4af37, #f2d472);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--negro-ebano); color: white; overflow-x: hidden; }

        /* NAV */
        nav { 
            background: rgba(5, 5, 5, 0.95); padding: 10px 5%; position: fixed; width: 100%; top: 0; z-index: 1000; 
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(212, 175, 55, 0.3); backdrop-filter: blur(15px); 
        }
        .brand-container { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .favicon-img { width: 45px; height: 45px; border-radius: 4px; border: 1px solid var(--oro); }
        .brand-name { font-family: 'Cinzel', serif; color: white; font-size: 1.1rem; font-weight: 700; }

        /* HERO */
        .hero {
            height: 65vh; background: linear-gradient(rgba(5, 5, 5, 0.8), rgba(5, 5, 5, 0.8)), url('https://images.unsplash.com/photo-1450101499163-c8848c66ca85?auto=format&fit=crop&w=1350&q=80');
            background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; margin-top: 65px;
        }
        .main-slogan { font-family: 'Cinzel', serif; font-size: clamp(1.5rem, 5vw, 2.5rem); color: white; letter-spacing: 3px; text-transform: uppercase; }
        .sub-slogan { font-family: 'Playfair Display', serif; font-style: italic; font-size: clamp(1rem, 2.5vw, 1.6rem); color: var(--oro); margin-top: 10px; }

        /* CHAT INTERFACE (PYTHON BACKEND) */
        .bot-wrapper { position: fixed; bottom: 30px; right: 30px; z-index: 3000; }
        .chat-window { 
            width: 320px; background: white; border-radius: 15px; overflow: hidden; display: none; 
            flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.6); margin-bottom: 15px; border: 1px solid var(--oro);
        }
        .chat-header { background: var(--gradient-oro); color: black; padding: 15px; font-weight: bold; font-family: 'Cinzel'; display: flex; justify-content: space-between; align-items: center; }
        .chat-body { height: 300px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f9f9f9; color: #333; font-size: 0.85rem; }
        .msg { padding: 10px 14px; border-radius: 15px; max-width: 85%; line-height: 1.4; font-size: 0.85rem; }
        .msg-bot { background: #eee; align-self: flex-start; border-bottom-left-radius: 0; }
        .msg-user { background: var(--oro); color: black; align-self: flex-end; border-bottom-right-radius: 0; font-weight: 500; }
        .chat-footer { padding: 12px; background: white; display: flex; border-top: 1px solid #eee; gap: 8px; }
        .chat-footer input { flex: 1; border: 1px solid #ddd; padding: 8px 15px; color: black; border-radius: 25px; outline: none; }
        .bot-trigger { 
            background: var(--gradient-oro); width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: black; font-size: 30px; 
            cursor: pointer; border: none; box-shadow: 0 4px 15px rgba(212,175,55,0.4); transition: 0.3s;
        }

        /* LOGOS */
        .seccion-logos { background: #ffffff; padding: 35px; display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; border-top: 4px solid var(--oro); }
        .logo-img { height: 35px; filter: grayscale(1); opacity: 0.7; transition: 0.3s; }
        .logo-img:hover { filter: grayscale(0); opacity: 1; }

        /* CONTAINERS & FORMS */
        .container { max-width: 900px; margin: 0 auto; padding: 50px 20px; }
        .dark-section { background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 8px; margin-bottom: 40px; border: 1px solid rgba(212, 175, 55, 0.2); }
        h3 { color: var(--oro); font-family: 'Cinzel'; text-align: center; margin-bottom: 25px; letter-spacing: 1px; }
        input, select { width: 100%; padding: 14px; margin: 10px 0; background: rgba(0,0,0,0.5); border: 1px solid #333; color: white; border-radius: 4px; }
        .boton-oro { background: var(--gradient-oro); color: black; font-weight: bold; padding: 16px; width: 100%; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .boton-oro:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3); }

        footer { padding: 40px; text-align: center; color: #666; font-size: 0.8rem; border-top: 1px solid #111; }
    </style>
</head>
<body>

    <div class="bot-wrapper">
        <div class="chat-window" id="chatWindow">
            <div class="chat-header">
                <span><i class="fas fa-robot"></i> JCNay AI Asistente</span>
                <button onclick="toggleBot()" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div class="chat-body" id="chatBody">
                <div class="msg msg-bot">Hola soy el asistente virtual de JC Nay como te puedo ayudar hoy</div>
            </div>
            <div class="chat-footer">
                <input type="text" id="userInput" placeholder="Escribe tu mensaje..." onkeypress="handleKey(event)">
                <button onclick="sendMessage()" style="background:none; border:none; color:var(--oro); cursor:pointer; font-size: 1.2rem;"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
        <button class="bot-trigger" onclick="toggleBot()">
            <i class="fas fa-comment-dots"></i>
        </button>
    </div>

    <nav>
        <a href="#" class="brand-container">
            <img src="img/logo-jcnay.jpg" alt="JN" class="favicon-img">
            <span class="brand-name">JCNay Vida Team</span>
        </a>
    </nav>

    <header class="hero">
        <h1 id="typewriter-main" class="main-slogan"></h1>
        <p id="typewriter-sub" class="sub-slogan"></p>
        <a href="https://calendly.com/blindajefamiliarus" target="_blank" class="boton-oro" style="text-decoration:none; width:auto; padding:15px 40px; margin-top:30px; display:inline-block; border-radius:4px;">Agendar Cita Gratuita</a>
    </header>

    <section class="seccion-logos">
        <img src="img/nlg.png" class="logo-img" alt="National Life">
        <img src="img/fg.png" class="logo-img" alt="F&G">
        <img src="img/ethos.png" class="logo-img" alt="Ethos">
        <img src="img/senior.png" class="logo-img" alt="Senior Life">
        <img src="img/american.png" class="logo-img" alt="American Amicable">
    </section>

    <div class="container">
        <section class="dark-section" data-aos="fade-up">
            <h3>📥 Guía Estratégica "Banco Libre"</h3>
            <form id="form-guia">
                <input type="text" name="nombre_tipo" placeholder="Nombre y Apellido" required>
                <input type="number" name="edad_estado" placeholder="Tu Edad" required>
                <select name="ingresos_licencia" required>
                    <option value="" disabled selected>Rango de Ingresos Anuales</option>
                    <option value="Menos de 50K">Menos de $50,000</option>
                    <option value="50K a 100K">$50,000 - $100,000</option>
                    <option value="Mas de 100K">Más de $100,000</option>
                </select>
                <input type="text" name="telefonos" placeholder="Teléfono o Email de contacto" required>
                <input type="hidden" name="tipo_registro" value="LEAD_GUIA">
                <button type="submit" class="boton-oro">Obtener Guía Ahora</button>
            </form>
        </section>

        <section class="dark-section" style="border: 2px solid var(--oro);" data-aos="fade-up">
            <h3>🤝 Únete a nuestro equipo (50 Estados USA)</h3>
            <form id="form-socio">
                <input type="text" name="nombre_tipo" placeholder="Nombre y Apellido" required>
                <select name="edad_estado" required>
                    <option value="" disabled selected>Estado donde resides</option>
                    <option value="AL">Alabama</option><option value="AK">Alaska</option><option value="AZ">Arizona</option><option value="AR">Arkansas</option><option value="CA">California</option><option value="CO">Colorado</option><option value="CT">Connecticut</option><option value="DE">Delaware</option><option value="FL">Florida</option><option value="GA">Georgia</option><option value="HI">Hawaii</option><option value="ID">Idaho</option><option value="IL">Illinois</option><option value="IN">Indiana</option><option value="IA">Iowa</option><option value="KS">Kansas</option><option value="KY">Kentucky</option><option value="LA">Louisiana</option><option value="ME">Maine</option><option value="MD">Maryland</option><option value="MA">Massachusetts</option><option value="MI">Michigan</option><option value="MN">Minnesota</option><option value="MS">Mississippi</option><option value="MO">Missouri</option><option value="MT">Montana</option><option value="NE">Nebraska</option><option value="NV">Nevada</option><option value="NH">New Hampshire</option><option value="NJ">New Jersey</option><option value="NM">New Mexico</option><option value="NY">New York</option><option value="NC">North Carolina</option><option value="ND">North Dakota</option><option value="OH">Ohio</option><option value="OK">Oklahoma</option><option value="OR">Oregon</option><option value="PA">Pennsylvania</option><option value="RI">Rhode Island</option><option value="SC">South Carolina</option><option value="SD">South Dakota</option><option value="TN">Tennessee</option><option value="TX">Texas</option><option value="UT">Utah</option><option value="VT">Vermont</option><option value="VA">Virginia</option><option value="WA">Washington</option><option value="WV">West Virginia</option><option value="WI">Wisconsin</option><option value="WY">Wyoming</option>
                </select>
                <input type="text" name="telefonos" placeholder="Teléfono o Email de contacto" required>
                <input type="hidden" name="ingresos_licencia" value="Candidato Socio">
                <input type="hidden" name="tipo_registro" value="LEAD_SOCIO">
                <button type="submit" class="boton-oro">Aplicar como Socio</button>
            </form>
        </section>
    </div>

    <footer>JCNay Vida Team &copy; 2026 | Azure Gold Studio</footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        // 1. CONFIGURACIÓN DEL CHAT (PYTHON + OPENAI)
        const NGROK_URL = 'https://blae-lashaunda-loopily.ngrok-free.dev/chat'; 

        function toggleBot() {
            const win = document.getElementById('chatWindow');
            win.style.display = win.style.display === 'flex' ? 'none' : 'flex';
        }

        function handleKey(e) { if (e.keyCode === 13) sendMessage(); }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBody = document.getElementById('chatBody');
            const userText = input.value.trim();

            if (!userText) return;

            // Mostrar mensaje usuario
            chatBody.innerHTML += `<div class="msg msg-user">${userText}</div>`;
            input.value = "";
            chatBody.scrollTop = chatBody.scrollHeight;

            try {
                // LLAMADA A TU NGROK
                const response = await fetch(NGROK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userText })
                });
                const data = await response.json();
                
                chatBody.innerHTML += `<div class="msg msg-bot">${data.reply}</div>`;
            } catch (err) {
                chatBody.innerHTML += `<div class="msg msg-bot">Estoy procesando muchas consultas, por favor escríbeme directamente a WhatsApp si no respondo pronto.</div>`;
            }
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        // 2. EFECTO TYPEWRITER
        function typeWriter(text, elementId, speed, callback) {
            let i = 0; const element = document.getElementById(elementId);
            function type() { if (i < text.length) { element.innerHTML += text.charAt(i); i++; setTimeout(type, speed); } else if (callback) { callback(); } }
            type();
        }
        window.onload = () => {
            typeWriter("Mas que Seguros", "typewriter-main", 70, () => {
                setTimeout(() => { typeWriter("diseñamos Seguridad Financiera", "typewriter-sub", 50); }, 500);
            });
        };

        // 3. CONEXIÓN CRM (GOOGLE SHEETS)
        const CRM_URL = 'https://script.google.com/macros/s/AKfycbykZuGS78TLHdGUaGOPvkSVzLIa1h7BfMhcKE6FB-lhf4d3SVcubFkd-scoFGWWBg9hqg/exec';
        
        function conectarCRM(idForm) {
            const form = document.getElementById(idForm);
            form.addEventListener('submit', e => {
                e.preventDefault();
                const btn = form.querySelector('button');
                btn.innerText = 'ENVIANDO...'; btn.disabled = true;

                fetch(CRM_URL, { method: 'POST', body: new FormData(form), mode: 'no-cors' })
                .then(() => {
                    window.location.href = "gracias.html";
                })
                .catch(() => {
                    alert("Error al enviar. Inténtalo de nuevo.");
                    btn.innerText = 'REINTENTAR'; btn.disabled = false;
                });
            });
        }
        conectarCRM('form-guia'); 
        conectarCRM('form-socio');
    </script>
</body>
</html>
