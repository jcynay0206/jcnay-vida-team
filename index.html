<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCNay Vida Team | Protección & Riqueza</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;1,700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --oro: #d4af37;
            --oro-brillante: #f2d472;
            --negro-ebano: #050505;
            --gradient-oro: linear-gradient(45deg, #b8860b, #d4af37, #f2d472);
            --blanco-marmol: #f5f5f5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--negro-ebano); color: white; overflow-x: hidden; }

        /* NAVEGACIÓN */
        nav { 
            background: rgba(5, 5, 5, 0.95); padding: 15px 5%; position: fixed; width: 100%; top: 0; z-index: 1000; 
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(212, 175, 55, 0.3); backdrop-filter: blur(15px); 
        }
        .brand-container { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .favicon-img { width: 50px; height: 50px; border-radius: 4px; object-fit: cover; border: 1px solid var(--oro); }
        .brand-name { font-family: 'Cinzel', serif; color: white; font-size: 1.2rem; font-weight: 700; }

        /* HERO */
        .hero {
            height: 60vh; background: linear-gradient(rgba(5, 5, 5, 0.8), rgba(5, 5, 5, 0.8)), url('https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=1350&q=80');
            background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; margin-top: 80px; border-bottom: 2px solid var(--oro);
        }
        .hero p { font-family: 'Playfair Display', serif; font-style: italic; font-size: clamp(1.2rem, 4vw, 2.2rem); color: var(--blanco-marmol); margin-bottom: 30px; }

        .container { max-width: 1100px; margin: 0 auto; padding: 60px 20px; }
        section.dark-section { background: rgba(255, 255, 255, 0.02); padding: 40px; border-radius: 4px; margin-bottom: 40px; border: 1px solid rgba(212, 175, 55, 0.1); }
        h3 { font-family: 'Cinzel', serif; color: var(--oro); text-align: center; margin-bottom: 25px; letter-spacing: 2px; }
        
        input, select, textarea { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid rgba(212, 175, 55, 0.2); background: rgba(0,0,0,0.5); color: white; border-radius: 2px; font-family: 'Poppins', sans-serif; font-size: 0.9rem; }
        option { background: var(--negro-ebano); color: white; }

        .boton-oro { 
            background: var(--gradient-oro); color: black !important; padding: 15px 30px; font-weight: 800; text-transform: uppercase; 
            border: none; cursor: pointer; width: 100%; letter-spacing: 1px; transition: 0.3s;
        }

        /* CHECKBOX CUSTOM */
        .check-container { display: flex; align-items: flex-start; gap: 10px; margin: 15px 0; font-size: 0.85rem; color: #ccc; cursor: pointer; text-align: left; }
        .check-container input { width: auto; margin-top: 4px; accent-color: var(--oro); }

        /* LOGOS */
        .seccion-socios { background: white; padding: 40px 20px; text-align: center; }
        .contenedor-logos { display: flex; justify-content: center; align-items: center; gap: 40px; flex-wrap: wrap; }
        .logo-img { height: 35px; filter: grayscale(100%); opacity: 0.6; }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="brand-container">
            <img src="img/logo-jcnay.jpg" alt="JN" class="favicon-img">
            <span class="brand-name">JCNay Vida Team</span>
        </a>
    </nav>

    <header class="hero">
        <p data-aos="fade-up">Más que Seguros, diseñamos Seguridad Financiera</p>
        <a href="#guia" class="boton-oro" style="width:auto; padding: 18px 45px;">Solicitar Guía Privada</a>
    </header>

    <section class="seccion-socios">
        <div class="contenedor-logos">
            <img src="https://www.nationallife.com/images/logos/nlg_logo_header.png" alt="National Life" class="logo-img">
            <img src="https://www.fglife.com/sites/default/files/fg-logo-header.png" alt="F&G" class="logo-img">
            <img src="https://images.ctfassets.net/706v73v0z7id/3N1f9H8H8W9W1W1W1W1W1W/1908d172782e5b8801d0a5e865f3a093/ethos-logo.png" alt="Ethos" class="logo-img">
            <img src="https://seniorlifeinsurancecompany.com/wp-content/uploads/2021/05/Logo.png" alt="Senior Life" class="logo-img">
        </div>
    </section>

    <div class="container">
        <section id="guia" class="dark-section" data-aos="fade-up">
            <h3>📥 Guía "Banco Libre"</h3>
            <form id="form-guia">
                <input type="text" name="nombre" placeholder="NOMBRE COMPLETO" required>
                <input type="email" name="email" placeholder="CORREO ELECTRÓNICO" required>
                <input type="number" name="ingresos" placeholder="INGRESOS ANUALES ($)" required>
                <input type="hidden" name="fuente" value="Guía Web">
                <button type="submit" class="boton-oro">Recibir Guía en mi CRM</button>
            </form>
        </section>

        <section id="socios" class="dark-section" data-aos="fade-up" style="border: 2px solid var(--oro)">
            <h3>🤝 Aplicación para Socios</h3>
            <form id="form-socio">
                <input type="text" name="nombre" placeholder="NOMBRE COMPLETO" required>
                <input type="email" name="email" placeholder="EMAIL PROFESIONAL" required>
                <input type="tel" name="telefono" placeholder="TELÉFONO" required>
                
                <select name="estado" required>
                    <option value="" disabled selected>ESTADO DONDE RESIDE (USA)</option>
                    <option value="AL">Alabama</option><option value="AK">Alaska</option><option value="AZ">Arizona</option>
                    <option value="AR">Arkansas</option><option value="CA">California</option><option value="CO">Colorado</option>
                    <option value="CT">Connecticut</option><option value="DE">Delaware</option><option value="FL">Florida</option>
                    <option value="GA">Georgia</option><option value="HI">Hawaii</option><option value="ID">Idaho</option>
                    <option value="IL">Illinois</option><option value="IN">Indiana</option><option value="IA">Iowa</option>
                    <option value="KS">Kansas</option><option value="KY">Kentucky</option><option value="LA">Louisiana</option>
                    <option value="ME">Maine</option><option value="MD">Maryland</option><option value="MA">Massachusetts</option>
                    <option value="MI">Michigan</option><option value="MN">Minnesota</option><option value="MS">Mississippi</option>
                    <option value="MO">Missouri</option><option value="MT">Montana</option><option value="NE">Nebraska</option>
                    <option value="NV">Nevada</option><option value="NH">New Hampshire</option><option value="NJ">New Jersey</option>
                    <option value="NM">New Mexico</option><option value="NY">New York</option><option value="NC">North Carolina</option>
                    <option value="ND">North Dakota</option><option value="OH">Ohio</option><option value="OK">Oklahoma</option>
                    <option value="OR">Oregon</option><option value="PA">Pennsylvania</option><option value="RI">Rhode Island</option>
                    <option value="SC">South Carolina</option><option value="SD">South Dakota</option><option value="TN">Tennessee</option>
                    <option value="TX">Texas</option><option value="UT">Utah</option><option value="VT">Vermont</option>
                    <option value="VA">Virginia</option><option value="WA">Washington</option><option value="WV">West Virginia</option>
                    <option value="WI">Wisconsin</option><option value="WY">Wyoming</option>
                </select>

                <label class="check-container">
                    <input type="checkbox" name="ssn_check" required>
                    <span>Confirmo que poseo un SSN válido para procesar mi aplicación.</span>
                </label>

                <label class="check-container">
                    <input type="checkbox" name="mayor_edad" required>
                    <span>Confirmo que soy mayor de 18 años.</span>
                </label>

                <input type="hidden" name="fuente" value="Aplicación Socio">
                <button type="submit" class="boton-oro">Enviar Aplicación al CRM</button>
            </form>
        </section>
    </div>

    <footer>JCNay Vida Team &copy; 2026 | Azure Gold Studio</footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        // TU URL DE GOOGLE APPS SCRIPT
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbykZuGS78TLHdGUaGOPvkSVzLIa1h7BfMhcKE6FB-lhf4d3SVcubFkd-scoFGWWBg9hqg/exec';

        function conectarCRM(formId) {
            const form = document.getElementById(formId);
            form.addEventListener('submit', e => {
                e.preventDefault();
                const btn = form.querySelector('button');
                btn.innerText = 'ENVIANDO...';
                btn.disabled = true;

                // Enviamos los datos usando fetch para que tu CRM los reciba
                fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', // Importante para Google Apps Script
                    body: new FormData(form)
                })
                .then(() => {
                    // Redirección a la página de gracias tras el envío exitoso
                    window.location.href = "gracias.html";
                })
                .catch(err => {
                    console.error('Error:', err);
                    alert('Error al conectar con el CRM. Intente nuevamente.');
                    btn.disabled = false;
                    btn.innerText = 'REINTENTAR';
                });
            });
        }

        conectarCRM('form-guia');
        conectarCRM('form-socio');
    </script>
</body>
</html>
