<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCNay Vida Team | Sistema Integral</title>
    <style>
        :root { --primary: #1a2a6c; --secondary: #b21f1f; --accent: #fdbb2d; --white: #ffffff; --gray: #f4f4f4; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; }
        section { background: var(--white); padding: 30px; margin-bottom: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 5px solid var(--primary); }
        h1, h2 { color: var(--primary); text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-main { background: linear-gradient(to right, var(--primary), var(--secondary)); color: white; }
        .btn-agent { background: #25d366; color: white; }
        .calculator-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        @media (max-width: 600px) { .calculator-grid { grid-template-columns: 1fr; } }
        .result-box { background: var(--gray); padding: 20px; border-radius: 10px; border-left: 5px solid var(--accent); }
        .highlight { font-weight: bold; font-size: 1.2em; color: var(--secondary); }
    </style>
</head>
<body>

<div class="container">
    <section>
        <h1>🚀 JCNay Vida Team</h1>
        <p style="text-align:center">Protección IUL y Ahorro Inteligente</p>
        <form id="mainForm">
            <input type="text" id="nombre" placeholder="Nombre completo" required>
            <input type="number" id="edad" placeholder="Tu Edad" required>
            <select id="ingresos" required>
                <option value="">Ingresos Anuales</option>
                <option value="Menos de $50k">Menos de $50k</option>
                <option value="$50k - $100k">$50k - $100k</option>
                <option value="Más de $100k">Más de $100k</option>
            </select>
            <button type="submit" class="btn-main">Descargar Guía y Calcular</button>
        </form>
    </section>

    <section>
        <h2>🎓 Plan Universitario: Banco vs IUL</h2>
        <div class="calculator-grid">
            <div>
                <label>Aporte Mensual ($):</label>
                <input type="number" id="uni_aporte" value="300" oninput="calcularUni()">
                <label>Edad del niño:</label>
                <input type="number" id="uni_edad" value="1" oninput="calcularUni()">
            </div>
            <div class="result-box">
                <p>A los 18 años tendrías:</p>
                <div>Banco (0.5%): <span id="res_banco" class="highlight">$0</span></div>
                <div>Estrategia IUL (7%): <span id="res_iul" class="highlight" style="color: #28a745;">$0</span></div>
                <hr>
                <p>Diferencia: <span id="res_diff" style="color: var(--primary); font-weight:bold;">$0</span></p>
            </div>
        </div>
    </section>

    <section style="border-top: 5px solid #25d366;">
        <h2>💼 Únete a Nuestro Equipo</h2>
        <form id="agenteForm">
            <input type="text" id="reg_nombre" placeholder="Nombre completo" required>
            <input type="text" id="reg_estado" placeholder="Estado de residencia" required>
            <select id="reg_licencia" required>
                <option value="">¿Tienes licencia?</option>
                <option value="Si">Sí</option>
                <option value="No">No</option>
            </select>
            <input type="tel" id="reg_telefono" placeholder="WhatsApp" required>
            <button type="submit" class="btn-agent">Enviar Solicitud de Agente</button>
        </form>
    </section>
</div>
