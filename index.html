<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCNay Vida Team | Protección Financiera</title>
    <style>
        :root { 
            --fondo-oscuro: #1c252e; /* Gris Navy Oscuro Mate */
            --tarjeta: #ffffff;
            --dorado: #c5a059;
            --azul-botones: #1a2a6c;
            --verde: #25d366;
            --texto-claro: #f1f2f6;
        }
        
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--fondo-oscuro); 
            margin: 0; padding: 15px; color: var(--texto-claro);
            line-height: 1.6;
        }

        .container { max-width: 850px; margin: 0 auto; }
        
        header { 
            padding: 40px 20px; 
            text-align: center; 
            margin-bottom: 25px;
        }

        .frase { 
            font-style: italic; 
            color: var(--dorado); 
            margin-top: 12px; 
            font-size: 1.25em;
            font-weight: 300;
        }

        section { 
            background: var(--tarjeta); 
            padding: 28px; 
            border-radius: 18px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
            margin-bottom: 25px; 
            color: #2d3436; 
        }

        .grid-externas { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; 
            margin-bottom: 25px; 
        }
        
        .card-ext { 
            background: rgba(255,255,255,0.07); 
            padding: 20px; 
            border-radius: 15px; 
            text-align: center; 
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            transition: 0.3s;
        }
        .card-ext:hover { background: rgba(255,255,255,0.12); }

        input, select { 
            width: 100%; padding: 13px; margin: 10px 0; border: 1.5px solid #dfe6e9; 
            border-radius: 10px; font-size: 16px; box-sizing: border-box; background: #fafafa;
        }

        .btn { 
            width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; 
            font-weight: bold; cursor: pointer; text-decoration: none; display: block; 
            text-align: center; transition: 0.4s; box-sizing: border-box; margin-top: 10px;
        }
        .btn-azul { background: var(--azul-botones); color: white; }
        .btn-verde { background: var(--verde); color: white; }
        .btn-dorado { background: var(--dorado); color: white; }

        #res_brecha { font-size: 36px; font-weight: bold; color: #d63031; margin: 10px 0; }
        
        #modalFiltro { 
            display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
            background:rgba(0,0,0,0.9); z-index:9999; align-items:center; justify-content:center; 
        }
        .modal-content { background:white; padding:35px; border-radius:25px; width:90%; max-width:420px; text-align:center; color: #2d3436; }
    </style>
</head>
